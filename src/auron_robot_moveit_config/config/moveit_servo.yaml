###############################################
# MoveIt Servo configuration for Auron Robot
###############################################

## Properties of outgoing commands
publish_period: 0.02  # 50 Hz
max_expected_latency: 0.1

command_in_type: "unitless"  # "unitless" or "speed_units"
scale:
  linear: 0.4
  rotational: 0.8
  joint: 0.5

incoming_command_timeout: 0.2

# Controller topic matching ros2_control
command_out_type: trajectory_msgs/JointTrajectory
command_out_topic: /arm_controller/joint_trajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Smoothing plugin
use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

# Set to false since move_group runs as the primary planning scene monitor
is_primary_planning_scene_monitor: false
check_octomap_collisions: false

## MoveIt properties
move_group_name: arm
planning_frame: base_link
robot_link_command_frame: base_link
ee_frame_name: tool0

## Singularity & joint limits
lower_singularity_threshold: 10.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.05]

## Topics
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status

## Collision checking
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.02
scene_collision_proximity_threshold: 0.05
